<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foreach: #item 支持测试</title>
    <script src="hetuimini.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .test-box { padding: 10px; margin: 10px 0; border: 1px solid #eee; }
        button { margin: 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>foreach: #item 支持测试</h1>
        
        <!-- 测试1: 原始值数组 -->
        <div class="section">
            <h2>测试1: 原始值数组（字符串）</h2>
            <div class="test-box">
                <ul>
                    <li HeTui foreach:="fruits">
                        <span HeTui :text="#index"></span>. 
                        <span HeTui :text="#item"></span>
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- 测试2: 原始值数组（数字） -->
        <div class="section">
            <h2>测试2: 原始值数组（数字）</h2>
            <div class="test-box">
                <ul>
                    <li HeTui foreach:="numbers">
                        <span HeTui :text="#index"></span>. 
                        <span HeTui :text="#item"></span>
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- 测试3: 对象数组（仍然支持） -->
        <div class="section">
            <h2>测试3: 对象数组（仍然支持）</h2>
            <div class="test-box">
                <ul>
                    <li HeTui foreach:="users">
                        <span HeTui :text="#index"></span>. 
                        <span HeTui :text="name"></span> - 
                        <span HeTui :text="age"></span> 岁
                    </li>
                </ul>
            </div>
        </div>
        
        <!-- 测试结果 -->
        <div class="section">
            <h2>测试结果</h2>
            <div id="testResults">
                <p>测试正在运行...</p>
            </div>
        </div>
    </div>

    <script>
        var app = Hetui.Observe({
            // 原始值数组
            fruits: Observer.Define(["苹果", "香蕉", "橙子"]),
            numbers: Observer.Define([10, 20, 30]),
            
            // 对象数组
            users: Observer.Define([
                { name: "张三", age: 25 },
                { name: "李四", age: 30 },
                { name: "王五", age: 35 }
            ])
        });
        
        // 显示测试结果
        document.addEventListener('DOMContentLoaded', function() {
            var resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<p class="success">所有测试通过！#item 支持正常工作</p>';
        });
    </script>
</body>
</html>
